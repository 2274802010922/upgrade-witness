name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
jobs:
  verify:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            binary: uw
          - os: windows-2025
            binary: uw.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Node is used only by the React/Tailwind application under test.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test native Rust and browser integration
        run: cargo test --locked
      - name: Check installed Chromium
        run: cargo run --locked -- doctor
      - name: Run migration demo end to end
        run: cargo run --locked -- demo --out .uw/ci-rust-demo
      - name: Build native release binary
        run: cargo build --release --locked
      - name: Verify source package
        run: cargo package --locked --no-verify
      - name: Retain synthetic reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-demo-${{ matrix.os }}
          path: .uw/ci-rust-demo/report/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Native binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uw-${{ matrix.os }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14

[package]
name = "upgrade-witness"
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "A Rust CLI and AI skill for reproducible frontend migration evidence"
license = "MIT"
repository = "https://github.com/2274802010922/upgrade-witness"
readme = "README.md"
publish = false
include = ["src/**", "Cargo.toml", "Cargo.lock", "README*", "LICENSE", "skills/**"]

[[bin]]
name = "uw"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
regex = "1.12"
url = "2.5"
image = { version = "0.25", default-features = false, features = ["png"] }
headless_chrome = "=1.0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[profile.release]
lto = "thin"
strip = true
